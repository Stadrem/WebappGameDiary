<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Diary</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1><span class="pixel-font">GAME DIARY</span> 🎮</h1>
            <p>Log your gaming adventures.</p>

            <div id="player-profile" class="player-profile">
                <div class="level-badge">LVL <span id="player-level">1</span></div>
                <div class="xp-container">
                    <div class="xp-bar-bg">
                        <div id="xp-bar-fill" class="xp-bar-fill" style="width: 0%;"></div>
                    </div>
                    <div class="xp-text"><span id="current-xp">0</span> / <span id="next-xp">100</span> XP</div>
                </div>
            </div>
        </header>

        <section class="controls">
            <input type="text" id="search-input" placeholder="Search games...">
        </section>

        <section class="entry-form">
            <h2>New Entry</h2>
            <form id="game-form">
                <div class="form-group">
                    <label for="title">Game Title</label>
                    <input type="text" id="title" required placeholder="e.g. The Legend of Zelda">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="genre">Genre</label>
                        <input type="text" id="genre" placeholder="e.g. RPG">
                    </div>
                    <div class="form-group">
                        <label for="platform">Platform</label>
                        <input type="text" id="platform" placeholder="e.g. PC, Switch">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status">
                            <option value="Playing">Playing</option>
                            <option value="Completed">Completed</option>
                            <option value="Dropped">Dropped</option>
                            <option value="Backlog">Backlog</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="rating">Rating (1-5)</label>
                        <input type="number" id="rating" min="1" max="5" step="0.5" value="5">
                    </div>
                </div>

                <div class="form-group">
                    <label for="playtime">Playtime (Hours)</label>
                    <input type="number" id="playtime" min="0" placeholder="0">
                </div>

                <div class="form-group">
                    <label for="review">Notes / Review</label>
                    <textarea id="review" rows="4" placeholder="How was the experience?"></textarea>
                </div>

                <button type="submit" class="btn-primary">Save Entry</button>
            </form>
        </section>

        <section class="entries-list">
            <h2>Your Log</h2>
            <div id="entries-container">
                <!-- Entries will be injected here -->
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
